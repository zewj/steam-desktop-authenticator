[package]
name = "sda-tauri"
version = "0.1.0"
description = "Steam Desktop Authenticator"
authors = ["zewj"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name from colliding with the bin name on
# Windows: https://github.com/rust-lang/cargo/issues/8519
name = "sda_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Steam Guard codes: HMAC-SHA1 over a 30s counter, rendered base-26.
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
hex = "0.4"

# .maFile at rest: AES-256-CBC with a PBKDF2-SHA1 key, as SDA writes it.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = "0.12"

# Enrollment: RSA PKCS#1 v1.5 for the password, HTTPS for the API.
rsa = "0.9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
urlencoding = "2"
# Only for the poll delay while Steam approves a sign-in.
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
